# Render Blueprint — free tier. Images are pulled from GHCR (public packages).
# Note: Render free Postgres databases expire 30 days after creation.
databases:
  - name: carnet-db
    plan: free
    databaseName: carnet
    user: carnet
    postgresMajorVersion: "18"

services:
  - type: web
    name: carnet-api
    runtime: image
    plan: free
    image:
      url: ghcr.io/jorisvilardell/444flox-memoire-api:latest
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3333"
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carnet-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ON_BOOT
        value: "true"

  - type: web
    name: carnet-web
    runtime: image
    plan: free
    image:
      url: ghcr.io/jorisvilardell/444flox-memoire-web:latest
    envVars:
      - key: API_URL
        sync: false
